services:
  esp-build:
    build: .
    volumes:
      - .:/project
    environment:
      - HOME=/tmp
    working_dir: /project
    command: idf.py build

  menuconfig:
    build: .
    volumes:
      - .:/project
    environment:
      - HOME=/tmp
    stdin_open: true
    tty: true
    working_dir: /project
    command: idf.py menuconfig

  flash:
    build: .
    volumes:
      - .:/project
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    working_dir: /project
    command: idf.py flash

  monitor:
    build: .
    volumes:
      - .:/project
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    working_dir: /project
    command: idf.py monitor

  clean:
    build: .
    volumes:
      - .:/project
    working_dir: /project
    command: idf.py clean