x-idf-service: &idf-service
  build:
    context: .
    args:
      ESP_IDF_IMAGE: ${ESP_IDF_IMAGE:-espressif/idf:release-v5.4}
  image: ble_hid-esp-build:local
  volumes:
    - .:/project
  environment:
    HOME: /tmp
  working_dir: /project

services:
  esp-build:
    <<: *idf-service
    command: idf.py build

  menuconfig:
    <<: *idf-service
    stdin_open: true
    tty: true
    command: idf.py menuconfig

  flash:
    <<: *idf-service
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    command: idf.py flash

  monitor:
    <<: *idf-service
    stdin_open: true
    tty: true
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    command: idf.py monitor

  clean:
    <<: *idf-service
    command: idf.py clean
