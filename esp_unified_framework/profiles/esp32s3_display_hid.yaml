name: esp32s3_display_hid
target: esp32s3
description: "ESP32-S3 全功能控制坞 (USB-OTG 键鼠 + 2.13\"/4.2\" SSD1683 墨水屏 + ST7789 + OTA)"
features:
  http_server: true
  web_ui: true
  rest_api: true
  camera: false
  gpio_ctrl: true
  ota: true
  storage: true
  display: true
  usb_otg: true
  ws_gateway: true
hardware:
  cpu_freq_mhz: 240
  spiram: true
  flash_size: "8MB"
defaults:
  wifi_ssid: "1"
  wifi_pass: "11111111"
  device_id: "esp32s3_dock"
  mdns_host: "s3-dock"
