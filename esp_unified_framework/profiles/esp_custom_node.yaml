defaults:
  device_id: esp_custom_node
  mdns_host: esp-custom
  wifi_pass: '11111111'
  wifi_ssid: '1'
features:
  camera: true
  display: false
  gpio_ctrl: true
  http_server: true
  ota: true
  rest_api: true
  storage: false
  usb_otg: true
