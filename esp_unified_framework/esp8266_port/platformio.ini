[env:esp8266_unified]
platform = espressif8266
board = esp01_1m
framework = arduino
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m.ld
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48
    -DFEATURE_WEB_UI=1
    -DFEATURE_REST_API=1
    -DFEATURE_GPIO_CTRL=1
    -DFEATURE_OTA=1
    -DFEATURE_FLEET_AGENT=1
    -DFW_VERSION=\"1.1.0-esp8266\"
